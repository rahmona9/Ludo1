      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK
        working-directory: LudoChampions
        run: gradle assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp LudoChampions/app/build/outputs/apk/debug/app-debug.apk LudoChampions.apk
          gh release delete latest -y --cleanup-tag --repo "$REPO" || true
          gh release create latest LudoChampions.apk --repo "$REPO" --title "Ludo Champions APK" --notes "Download LudoChampions.apk below and install it on your Android phone."
